# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1. TimeTrackBundle is require-dev (integration tests).
name: CI

on:
  push:
    # 2.x: the maintenance line after 3.0.0 (security fixes for 6 months).
    branches: [main, master, 2.x]
  pull_request:
    # feat/** too: the 2.15.0 REQ-ARCH-001 track is a stack of PRs whose bases are feature branches.
    branches: [main, master, 2.x, 'feat/**']

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level (a skipped matrix job leaves its required contexts "Expected"): the cells that are not
    # representative in light mode pass after one echo step.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout TaskBoardBundle
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7


      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          SYMFONY_MAJOR="${SYMFONY%%.*}"
          if [ "$SYMFONY_MAJOR" -ge 8 ]; then
            DOCTRINE_BUNDLE="^3.0"
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          bash .github/ci/composer-install.sh "${SYMFONY}" "${DOCTRINE_BUNDLE}"

      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test -- --display-deprecations
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  mysql:
    name: Functional + repository tests on MySQL
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task_board_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      # CI speed: the server is a throwaway. Its data directory is on tmpfs (service option above) and these
      # settings drop the per-commit fsync, so the per-test schema drop/create (tests/Functional/FunctionalTestCase)
      # no longer waits on the runner's disk. Locking, isolation levels and deadlock behaviour are unchanged.
      - name: Relax durability on the throwaway MySQL (no change to locking or isolation)
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:8.4")
          docker exec "$CID" mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL innodb_flush_log_at_trx_commit=0; SET GLOBAL sync_binlog=0;"

      - name: Run the functional suite against MySQL
        env:
          TASK_BOARD_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/task_board_test?serverVersion=8.4.0&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite functional

  # Since 2.23.1: MySQL 9 (EXTERNAL and LIBRARY became reserved words in 9.x). The whole functional suite, so the schema
  # creation and the task questions run there, beside MySQL 8.4 LTS.
  mysql9:
    name: Functional + repository tests on MySQL 9
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task_board_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      # CI speed: the server is a throwaway. Its data directory is on tmpfs (service option above) and these
      # settings drop the per-commit fsync, so the per-test schema drop/create (tests/Functional/FunctionalTestCase)
      # no longer waits on the runner's disk. Locking, isolation levels and deadlock behaviour are unchanged.
      - name: Relax durability on the throwaway MySQL (no change to locking or isolation)
        run: |
          CID=$(docker ps -q --filter "ancestor=mysql:9.7")
          docker exec "$CID" mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL innodb_flush_log_at_trx_commit=0; SET GLOBAL sync_binlog=0;"

      - name: Run the functional suite against MySQL 9
        env:
          TASK_BOARD_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/task_board_test?serverVersion=9.7.0&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite functional

  mariadb:
    name: Functional + repository tests on MariaDB
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: task_board_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      # Since 2.23.0 (REQ-RUNTIME-003, audit TE-I6): MariaDB's REPEATABLE READ and JSON-as-text, beside MySQL and PostgreSQL.
      - name: Run the functional suite against MariaDB
        env:
          TASK_BOARD_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/task_board_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite functional

  pgsql:
    name: Functional + repository tests on PostgreSQL
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: task_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_board_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      - name: Run the functional suite against PostgreSQL
        env:
          TASK_BOARD_TEST_DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/task_board_test?serverVersion=16&charset=utf8
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite functional

  twin-ports:
    name: Functional suite through the framework-free ports (twin replay)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      # Since 2.15.0 (REQ-ARCH-001): every host stub of the test kernels behind an adapter that implements ONLY the
      # framework-free twin of its port; the suite must give the same results.
      - name: Run the functional suite with twin-only host ports
        env:
          TASK_BOARD_TEST_PORTS: twin
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test -- --testsuite functional

  private-em:
    name: Functional suite with the private entity manager (replay)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      # Since 3.0.0 the private entity manager is the only mode (every suite runs with it); this job keeps its name for
      # the branch protection and replays the functional suite with database.mapping_type: xml (the DDD host's mapping).
      - name: Run the functional suite with the XML mapping
        env:
          TASK_BOARD_TEST_XML_MAPPING: '1'
        run: composer test -- --testsuite functional

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: bash .github/ci/composer-install-default.sh

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- src tests .php-cs-fixer.dist.php)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src tests .php-cs-fixer.dist.php
          git diff --staged --quiet || git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: bash .github/ci/composer-install-default.sh

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout TaskBoardBundle
        uses: actions/checkout@v7


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Since 2.25.0: 8.4, so SearchKit (PHP >= 8.3) is installed and the SearchKit groups count (.github/ci/search-kit.sh).
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: bash .github/ci/composer-install.sh 7.4 '^2.10'

      - name: Run tests with coverage (100% gate, REQ-TEST-003)
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage-100
          echo "✅ All tests passed and coverage is 100%"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7


      - uses: shivammathur/setup-php@v2
        with:
          # Since 2.25.0: 8.4, so the SearchKit groups are analysed (the floor job still runs PHPStan on 8.2).
          php-version: '8.4'
          extensions: json
          tools: composer:v2

      - run: bash .github/ci/composer-install-default.sh
      - run: composer phpstan

  release-gates:
    name: Release gate (make ${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        gate: ['rector-dry', 'validate-phpdoc', 'validate-translations', 'check-twig-extra']

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      GATE: ${{ matrix.gate }}
    steps:
      - name: Light mode (deps/docs-only PR) - release gates run in full mode only
        if: env.HEAVY != 'true'
        run: echo "Light mode, this gate runs on full-mode PRs and on every push."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Is make ${{ matrix.gate }} defined in this repo?
        if: env.HEAVY == 'true'
        id: gate
        run: |
          # Defined = the Makefile has a rule with a recipe for the target. Skip only on these two exact make answers;
          # any other make error (broken Makefile, missing include) fails the cell instead of hiding the gate.
          run=false
          if [ ! -f Makefile ]; then
            reason="no Makefile in this repo"
          else
            set +e
            plan=$(LC_ALL=C make -n -o ensure-up -o install "$GATE" 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && printf '%s\n' "$plan" | grep -qF "No rule to make target '$GATE'.  Stop."; then
              reason="the Makefile has no '$GATE' target"
            elif [ "$rc" -eq 0 ] && printf '%s\n' "$plan" | grep -qF "Nothing to be done for '$GATE'."; then
              reason="the Makefile declares '$GATE' without a recipe"
            elif [ "$rc" -ne 0 ]; then
              printf '%s\n' "$plan"
              echo "::error title=Release gate $GATE::make -n $GATE failed (exit $rc), see the output above"
              exit 1
            else
              run=true
              echo "make $GATE runs (docker compose exec/run prefixes are dropped, the command runs on the runner):"
              printf '%s\n' "$plan"
            fi
          fi
          if [ "$run" = false ]; then
            echo "::notice title=Release gate $GATE skipped::$reason, nothing to check."
            echo "Release gate \`$GATE\` skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.gate.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # Same PHP as this repo's phpstan job
          php-version: '8.4'
          tools: composer:v2

      - name: Get Composer cache directory
        if: steps.gate.outputs.run == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-release-gates-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-release-gates-composer-
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: make ${{ matrix.gate }}
        if: steps.gate.outputs.run == 'true'
        run: |
          # Stand-in for `docker compose`: `[global options] exec|run [options] <service> <command...>` runs <command>
          # here (-e VAR=value is exported, an absolute binary path missing on the runner is looked up on PATH). Any
          # other compose call (up, ps, ...) fails loudly: the gate needs a stack CI does not start.
          shim="$RUNNER_TEMP/compose-on-runner"
          cat > "$shim" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          sub=""
          while [ $# -gt 0 ]; do
            case "$1" in
              exec|run) sub=$1; shift; break ;;
              -f|--file|-p|--project-name|--project-directory|--env-file|--profile|--ansi|--progress) shift 2 ;;
              -*) shift ;;
              *) break ;;
            esac
          done
          if [ -z "$sub" ]; then echo "compose-on-runner: 'compose $*' needs the Docker stack, CI has none" >&2; exit 1; fi
          while [ $# -gt 0 ]; do
            case "$1" in
              -e|--env) export "$2"; shift 2 ;;
              --env=*) export "${1#--env=}"; shift ;;
              -w|--workdir|-u|--user|--name|--entrypoint|--index) shift 2 ;;
              -*) shift ;;
              *) shift; break ;;
            esac
          done
          if [ $# -eq 0 ]; then echo "compose-on-runner: no command after the service" >&2; exit 1; fi
          if [ "${1#/}" != "$1" ] && [ ! -x "$1" ]; then set -- "${1##*/}" "${@:2}"; fi
          exec "$@"
          SHIM
          chmod +x "$shim"
          make -o ensure-up -o install COMPOSE="$shim" COMPOSE_BIN="$shim" "$GATE"

  typescript:
    name: Vitest (TypeScript)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  security-audit:
    name: Composer audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7


      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: bash .github/ci/composer-install-default.sh
      - run: composer audit

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        # About 8 minutes on 537 service files: above Composer's default 300 s process timeout.
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/task-board-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
