# REQ-DEMO-014: UiKit's default theme, unchanged (no CSS framework, no CDN, no token override); the demo shell
# (templates/base.html.twig, UiKit's demo platform layout) is the admin and guest layout of every bundle page. Icons
# are inline SVG (no icon font from a CDN).
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: svg_inline
    layouts:
        admin: base.html.twig
        guest: base.html.twig
    # Since TaskBoard 2.22.0: the context menus of the cards, list rows and column headers (UiKit 2.54) and the shell focus
    # mode (UiKit 2.55; the demo platform shell is the focus mode shell root).
    theme:
        context_menus: true
        focus_mode:
            enabled: true
