services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TaskBoardBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../TaskBoardBundle.php'
            - '../../Resources/'
            # Value objects / data carriers are not services (REQ: keep the container free of non-services).
            - '../../Entity/'
            - '../../Dto/'
            - '../../Event/'
            - '../../Enum/'
            - '../../Exception/'
            - '../../ValueObject/'
            - '../../Import/Dto/'
            - '../../Import/TaskImportSource.php'
            # Since 1.22: per-run helper built by the orchestrator (holds the board of the run).
            - '../../Import/ImportAssigneeResolver.php'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Bridge/TimeTrack/'
            - '../../EventListener/TimeSpentAggregatorListener.php'
            - '../../Security/TaskBoardAccessCheckerInterface.php'
            - '../../Security/TenantAwareTaskBoardAccessCheckerInterface.php'
            - '../../Security/ConfigurableTaskBoardAccessChecker.php'
            - '../../Security/AllowAllTaskBoardAccessChecker.php'
            - '../../Security/TaskBoardTeamMembershipResolverInterface.php'
            - '../../Security/NullTaskBoardTeamMembershipResolver.php'
            - '../../Security/TaskBoardResourceAccessChecker.php'
            # Since 1.25: built by TaskBoardEraser from its cursor secret (audit FP-L3).
            - '../../Security/EraseCursorSigner.php'
            - '../../Tenancy/TaskBoardTenant.php'
            - '../../Tenancy/TaskBoardTenantResolverInterface.php'
            - '../../Tenancy/SlugTaskBoardTenantResolver.php'
            - '../../Routing/TenantPathUrlGenerator.php'
            - '../../Assignee/'
            # Since 1.23: the sync services are registered by services_sync.yaml (sync.enabled) and the avatar
            # services explicitly below.
            - '../../Sync/'
            - '../../Avatar/'
            - '../../Controller/TaskBoardConnectionController.php'
            - '../../Command/TaskBoardSyncCommand.php'
            - '../../Link/TaskObjectLinkResolverInterface.php'
            - '../../Link/TaskObjectBadge.php'
            - '../../Comment/MentionCandidate.php'

    Nowo\TaskBoardBundle\Controller\:
        resource: '../../Controller/'
        # Since 1.23: registered by services_sync.yaml (sync.enabled).
        exclude: '../../Controller/TaskBoardConnectionController.php'
        public: true

    Nowo\TaskBoardBundle\Routing\TaskBoardRouteLoader:
        arguments:
            $routes: '%nowo_task_board.routes%'
            $routePrefix: '%nowo_task_board.route_prefix%'
            $tenancy: '%nowo_task_board.tenancy%'
        tags:
            - { name: routing.loader }

    Nowo\TaskBoardBundle\Controller\TaskBoardManageController:
        public: true
        arguments:
            $routes: '%nowo_task_board.routes%'
            $templates: '%nowo_task_board.templates%'
            $userClass: '%nowo_task_board.user_class%'
            $dashboardRoute: '%nowo_task_board.dashboard_route%'
            $topLevelOnly: '%nowo_task_board.board.top_level_only%'
            $columnIcons: '%nowo_task_board.board.column_icons%'
            $readersCanComment: '%nowo_task_board.comments.readers_can_comment%'
            $maxTasks: '%nowo_task_board.board.max_tasks%'
            # Since 1.24: the dialog mode header of an invalid board create (`board.create_dialog_header`).
            $createDialogHeader: '%nowo_task_board.board.create_dialog_header%'

    Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver:
        class: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\TaskImportUserResolverInterface:
        alias: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Jira\JiraCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Trello\TrelloJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskBoard\TaskBoardCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskBoard\TaskBoardJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskImportOrchestrator:
        arguments:
            $importers: !tagged_iterator nowo_task_board.task_importer
            $maxRows: '%nowo_task_board.import.max_rows%'

    # Since 1.22 (audit DL-L4): CSV row and cell limits (`import.*`); the CSV importers get this instance.
    # Since 1.22.1 (audit DL-L6): column and filled-cell limits too.
    Nowo\TaskBoardBundle\Import\Support\DelimitedTableParser:
        arguments:
            $maxRows: '%nowo_task_board.import.max_rows%'
            $maxCellLength: '%nowo_task_board.import.max_cell_length%'
            $maxColumns: '%nowo_task_board.import.max_columns%'
            $maxCells: '%nowo_task_board.import.max_cells%'

    # Since 1.22.1 (audit EB-L3): JSON imports are weighed before they are decoded; the JSON importers get this instance.
    Nowo\TaskBoardBundle\Import\Support\JsonImportGuard:
        arguments:
            $maxNodes: '%nowo_task_board.import.max_json_nodes%'
            $maxRows: '%nowo_task_board.import.max_rows%'

    # Since 1.22: source ids already imported into another board of the tenant (cross-board rule of the import).
    Nowo\TaskBoardBundle\Import\TaskImportLinkLookupInterface:
        alias: Nowo\TaskBoardBundle\Import\DoctrineTaskImportLinkLookup

    Nowo\TaskBoardBundle\Command\TaskBoardImportCommand: ~

    # REQ-UI-001: Twig globals from templates.layout / templates.css_framework.
    Nowo\TaskBoardBundle\Twig\TaskBoardTwigExtension:
        arguments:
            $routes: '%nowo_task_board.routes%'
            $filtersCollapse: '%nowo_task_board.templates.filters_collapse%'
            $filtersFormClass: '%nowo_task_board.templates.filters_form_class%'
            $textRenderer: '@Nowo\TaskBoardBundle\Text\TaskTextRendererInterface'
            $avatars: '@Nowo\TaskBoardBundle\Avatar\TaskMemberAvatars'
            $connectionBadgeTemplate: '%nowo_task_board.templates.connection_badge%'
            $syncBadgeConnectLink: '%nowo_task_board.sync.badge.connect_link%'
            $taskTimeBefore: '%nowo_task_board.templates.task_time_before%'

    # Since 2.0.0: the layout of the pages (web_ui.layout_template, or the deprecated templates.layout).
    Nowo\TaskBoardBundle\Ui\TaskBoardPages:
        arguments:
            $layoutTemplate: '%nowo_task_board.web_ui.layout_template%'

    # Since 1.19: user text (comments, plain-text descriptions) → HTML; hosts alias the interface to their renderer.
    Nowo\TaskBoardBundle\Text\PlainTaskTextRenderer: ~
    Nowo\TaskBoardBundle\Text\TaskTextRendererInterface:
        alias: Nowo\TaskBoardBundle\Text\PlainTaskTextRenderer

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\TaskBoardBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    # Since 1.10 (tenancy): the tenant of the request and the tenant copies of the manage routes.
    Nowo\TaskBoardBundle\Tenancy\TaskBoardTenantContext:
        arguments:
            $enabled: '%nowo_task_board.tenancy.enabled%'
            $singleBoard: '%nowo_task_board.tenancy.single_board%'

    Nowo\TaskBoardBundle\Routing\TenantPaths:
        arguments:
            $tenantPaths: '%nowo_task_board.tenancy.tenant_paths%'
            $routes: '%nowo_task_board.routes%'
            $enabled: '%nowo_task_board.tenancy.enabled%'

    Nowo\TaskBoardBundle\Service\TaskBoardCreator:
        arguments:
            $defaultColumns: '%nowo_task_board.board.default_columns%'

    # Since 1.25: the erase cursor is signed with the application secret (audit FP-L3).
    Nowo\TaskBoardBundle\Service\TaskBoardEraser:
        arguments:
            $cursorSecret: '%kernel.secret%'

    # Since 1.10: host object links (TaskLinkType::HostObject) resolved by the host's resolvers.
    Nowo\TaskBoardBundle\Link\TaskObjectLinkResolver:
        arguments:
            $resolvers: !tagged_iterator nowo_task_board.object_link_resolver

    # Since 1.23: task member avatars — the host aliases the resolver; the default gives the initial chips.
    Nowo\TaskBoardBundle\Avatar\NullTaskMemberAvatarResolver: ~

    Nowo\TaskBoardBundle\Avatar\TaskMemberAvatarResolverInterface:
        alias: Nowo\TaskBoardBundle\Avatar\NullTaskMemberAvatarResolver

    Nowo\TaskBoardBundle\Avatar\TaskMemberAvatars:
        arguments:
            $resolver: '@Nowo\TaskBoardBundle\Avatar\TaskMemberAvatarResolverInterface'
            $logger: '@?logger'
        tags: [{ name: kernel.reset, method: reset }]

