services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TaskBoardBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../TaskBoardBundle.php'
            - '../../Resources/'
            # Value objects / data carriers are not services (REQ: keep the container free of non-services).
            - '../../Entity/'
            - '../../Dto/'
            - '../../Event/'
            - '../../Enum/'
            - '../../Validation/'
            # Since 2.2.0 (spec 213): loaded only with `api.enabled` (services_api.yaml).
            - '../../Api/'
            - '../../Exception/'
            - '../../ValueObject/'
            # Since 2.29.0: read models of the id-based host ports (values, not services).
            - '../../View/BoardPage.php'
            - '../../View/BoardView.php'
            - '../../View/TaskPage.php'
            - '../../View/TaskView.php'
            - '../../View/TaskFlowDay.php'
            - '../../View/TaskCompletionSample.php'
            - '../../View/TaskColumnEntry.php'
            - '../../View/Views.php'
            - '../../Import/Dto/'
            - '../../Import/TaskImportSource.php'
            # Since 1.22: per-run helper built by the orchestrator (holds the board of the run).
            - '../../Import/ImportAssigneeResolver.php'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Bridge/TimeTrack/'
            # Since 2.25.0: registered by TaskBoardExtension (registerHeaderSearch(); the SearchKit groups only with SearchKit >= 1.9).
            - '../../Bridge/SearchKit/'
            # Since 3.4.0: registered by TaskBoardExtension (registerClientApi() with client_api.principal_resolver,
            # registerPersonalData(); the UserKit section only with UserKit installed).
            - '../../ClientApi/'
            - '../../PersonalData/'
            - '../../Bridge/UserKit/'
            - '../../Search/Header/'
            # Since 2.22.0: values of the task menu (the builder is a service).
            - '../../Menu/TaskMenu.php'
            - '../../Menu/TaskMenuContext.php'
            - '../../Menu/TaskMenuOperation.php'
            - '../../Menu/TaskTimerStart.php'
            - '../../Menu/TaskTimerStarterInterface.php'
            # Since 2.1.0: loaded only with `task_numbers.enabled` (services_numbers.yaml).
            - '../../Number/'
            # Since 2.3.0 (specs 215, 217): data carriers of the copier and the mover.
            - '../../Copy/TaskCopyOptions.php'
            - '../../Copy/TaskCopyPreview.php'
            - '../../Copy/TaskCopyResult.php'
            - '../../Copy/TaskColumnRule.php'
            - '../../Move/TaskMovePlan.php'
            # Since 2.19.0 (Beacon spec 234): data carriers of the restructure service.
            - '../../Folder/TaskBoardFolderSnapshot.php'
            - '../../Folder/TaskBoardMoveResult.php'
            - '../../Folder/TaskBoardRestructureRefusedException.php'
            - '../../Configuration/BoardColumnSpec.php'
            - '../../Configuration/BoardColumnsRefusedException.php'
            - '../../Configuration/BoardConfiguration.php'
            - '../../Configuration/BoardFieldSpec.php'
            - '../../Field/TaskCustomFieldCondition.php'
            - '../../Field/TaskCustomFieldRefusedException.php'
            # Since 2.3.0 (spec 215): loaded only with `recurrence.enabled` (services_recurrence.yaml).
            - '../../Recurrence/'
            - '../../Controller/TaskRecurrenceController.php'
            # Since 2.18.0 (Beacon spec 234): value objects of the member badge and write provenance ports.
            - '../../Member/MemberBadge.php'
            - '../../Member/MemberBadgeVariant.php'
            - '../../Provenance/WriteChannel.php'
            - '../../Provenance/WriteProvenance.php'
            # Since 2.16.0 (Beacon spec 234): loaded only with `task_templates.enabled` (services_templates.yaml).
            - '../../Template/'
            # Since 2.23.0 (Beacon spec 242): loaded only with `task_questions.enabled` (services_questions.yaml).
            - '../../Question/'
            - '../../Controller/TaskQuestionController.php'
            - '../../EventListener/TimeSpentAggregatorListener.php'
            - '../../Security/TaskBoardAccessCheckerInterface.php'
            - '../../Security/TenantAwareTaskBoardAccessCheckerInterface.php'
            - '../../Security/ConfigurableTaskBoardAccessChecker.php'
            - '../../Security/AllowAllTaskBoardAccessChecker.php'
            - '../../Security/TaskBoardTeamMembershipResolverInterface.php'
            - '../../Security/NullTaskBoardTeamMembershipResolver.php'
            - '../../Security/TaskBoardResourceAccessChecker.php'
            # Since 1.25: built by TaskBoardEraser from its cursor secret (audit FP-L3).
            - '../../Security/EraseCursorSigner.php'
            - '../../Tenancy/TaskBoardTenant.php'
            - '../../Tenancy/TaskBoardTenantResolverInterface.php'
            - '../../Tenancy/SlugTaskBoardTenantResolver.php'
            # Since 2.20.0 (Beacon spec 234, T004): value objects and the refusal of the re-parent port.
            - '../../Tree/TaskTreeNode.php'
            - '../../Tree/TaskReparentResult.php'
            - '../../Tree/TaskTreeRefusedException.php'
            - '../../Routing/TenantPathUrlGenerator.php'
            # Since 2.21.1 (REQ-SF-004): owned by TaskBoardRouteLoader; a service would be autoconfigured as a routing.loader.
            - '../../Routing/ControllerAttributeRouteLoader.php'
            - '../../Assignee/'
            # Since 1.23: the sync services are registered by services_sync.yaml (sync.enabled) and the avatar
            # services explicitly below.
            - '../../Sync/'
            - '../../Avatar/'
            - '../../Controller/TaskBoardConnectionController.php'
            # Since 3.2.0: registered by services_sync.yaml (sync.enabled).
            - '../../Controller/TaskSyncImportPlanController.php'
            - '../../Command/TaskBoardSyncCommand.php'
            - '../../Link/TaskObjectLinkResolverInterface.php'
            - '../../Link/TaskObjectBadge.php'
            - '../../Comment/MentionCandidate.php'
            # Since 2.14.0: value objects of the calendar annotations; the annotator is registered with a provider only.
            - '../../Calendar/'
            # Since 2.13.0: loaded only with `multi_board.enabled` (services_multi_board.yaml).
            - '../../MultiBoard/'
            - '../../Controller/TaskBoardMultiBoardController.php'
            - '../../Form/MultiBoardTaskFilterType.php'
            # Since 2.15.0: the gates and factories of the framework-free host ports (built by TaskBoardPortsPass).
            - '../../Port/'
            # Since 2.15.0: registered by the extension (database.user_reference).
            - '../../User/'

    # REQ-SF-004 rule 7 (since 2.21.1): the controllers carry #[Route] attributes but are NOT autoconfigured, so Symfony
    # >= 7.3 does not tag them routing.controller and a host's default `routing.controllers` import does not load the
    # bundle routes; the only way in stays the documented `type: nowo_task_board` import (route prefix, configurable
    # paths and names, feature switches). Each controller definition is tagged explicitly instead.
    Nowo\TaskBoardBundle\Controller\:
        resource: '../../Controller/'
        # Since 1.23: registered by services_sync.yaml (sync.enabled); since 2.3.0 the Repeat controller by
        # services_recurrence.yaml (recurrence.enabled).
        exclude:
            - '../../Controller/TaskBoardConnectionController.php'
            - '../../Controller/TaskRecurrenceController.php'
            # Since 2.13.0: registered by services_multi_board.yaml (multi_board.enabled).
            - '../../Controller/TaskBoardMultiBoardController.php'
            # Since 2.23.0: registered by services_questions.yaml (task_questions.enabled).
            - '../../Controller/TaskQuestionController.php'
            # Since 3.2.0: registered by services_sync.yaml (sync.enabled).
            - '../../Controller/TaskSyncImportPlanController.php'
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\TaskBoardBundle\Routing\TaskBoardRouteLoader:
        arguments:
            $routes: '%nowo_task_board.routes%'
            $routePrefix: '%nowo_task_board.route_prefix%'
            $tenancy: '%nowo_task_board.tenancy%'
        tags:
            - { name: routing.loader }

    Nowo\TaskBoardBundle\Controller\TaskBoardManageController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_task_board.routes%'
            $templates: '%nowo_task_board.templates%'
            $userClass: '%nowo_task_board.user_class%'
            $userReference: '%nowo_task_board.user_reference%'
            $dashboardRoute: '%nowo_task_board.dashboard_route%'
            $topLevelOnly: '%nowo_task_board.board.top_level_only%'
            $columnIcons: '%nowo_task_board.board.column_icons%'
            $readersCanComment: '%nowo_task_board.comments.readers_can_comment%'
            $maxTasks: '%nowo_task_board.board.max_tasks%'
            # Since 1.24: the dialog mode header of an invalid board create (`board.create_dialog_header`).
            $createDialogHeader: '%nowo_task_board.board.create_dialog_header%'
            # Since 2.31.0: the on-demand dialogs answer through UiKit's responder (its configured header names).
            $remoteDialog: '@?Nowo\UiKitBundle\Dialog\RemoteDialogResponder'

    # Since 2.3.0 (audit IC-I3): task events of a copy or an occurrence are dispatched after its commit.
    # Since 2.20.0 (audit PX-L3): public, so a host that calls a port inside its own transaction holds the events until its commit.
    Nowo\TaskBoardBundle\Service\TaskEventDeferral:
        public: true
        arguments:
            $dispatcher: '@event_dispatcher'

    Nowo\TaskBoardBundle\Service\TaskManager:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    # Since 2.20.0 (Beacon spec 234, T004): `max_subtask_depth` for every write that changes the task tree.
    Nowo\TaskBoardBundle\Tree\TaskTreeLimits:
        arguments:
            $maxSubtaskDepth: '%nowo_task_board.max_subtask_depth%'

    # Since 2.20.0 (Beacon spec 234, T004): the re-parent port (public for hosts); its store is registered with the repositories.
    Nowo\TaskBoardBundle\Tree\TaskReparenterInterface:
        alias: Nowo\TaskBoardBundle\Tree\TaskReparenter
        public: true

    Nowo\TaskBoardBundle\Service\TaskMemberAssigner:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'
            $users: '@Nowo\TaskBoardBundle\User\TaskBoardUserLocator'

    # Since 2.10.0 (spec 216): column and comment events, held until the commit of a write that defers them.
    Nowo\TaskBoardBundle\Service\BoardColumnManager:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    Nowo\TaskBoardBundle\Service\TaskCommentManager:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    # Since 2.11.0 (DDD audit G3): time entry, dependency and link events, held until the commit of a write that defers them.
    Nowo\TaskBoardBundle\Service\TaskTimeLogger:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    # Since 2.12.0 (Beacon D-20261111-12): the audited billable setter of manual entries (public for hosts).
    Nowo\TaskBoardBundle\Service\TaskTimeBillableService:
        public: true
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    # Since 2.12.0: ports of the billable default and the period lock of manual entries. With TimeTrackBundle the extension
    # points them at its bridges; a host alias of its own wins over both.
    Nowo\TaskBoardBundle\Service\TaskTimeBillableDefaultProviderInterface:
        alias: Nowo\TaskBoardBundle\Service\NullTaskTimeBillableDefaultProvider
    Nowo\TaskBoardBundle\Service\TaskTimePeriodLockInterface:
        alias: Nowo\TaskBoardBundle\Service\NoTaskTimePeriodLock

    Nowo\TaskBoardBundle\Service\TaskDependencyManager:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    Nowo\TaskBoardBundle\Service\TaskLinkAttacher:
        arguments:
            $eventDispatcher: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    # Since 2.10.0 (DDD audit G4): ports of the command services, aliased to the bundle's classes (public for hosts).
    Nowo\TaskBoardBundle\Service\TaskManagerInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskManager
        public: true
    Nowo\TaskBoardBundle\Service\TaskBoardCreatorInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskBoardCreator
        public: true
    Nowo\TaskBoardBundle\Service\TaskBoardEditorInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskBoardEditor
        public: true
    Nowo\TaskBoardBundle\Service\TaskCommentManagerInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskCommentManager
        public: true
    Nowo\TaskBoardBundle\Service\TaskTimeLoggerInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskTimeLogger
        public: true
    Nowo\TaskBoardBundle\Service\BoardColumnManagerInterface:
        alias: Nowo\TaskBoardBundle\Service\BoardColumnManager
        public: true
    # Since 2.11.0 (DDD audit G4): the move and erase ports (the eraser keeps its own canManageBoard() check).
    Nowo\TaskBoardBundle\Move\TaskMoverInterface:
        alias: Nowo\TaskBoardBundle\Move\TaskMover
        public: true
    Nowo\TaskBoardBundle\Service\TaskBoardEraserInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskBoardEraser
        public: true

    # Since 2.29.0 (DDD-host checklist B1 / B7 / B8): the id-based host ports (UserRef, ids, views; public for hosts).
    Nowo\TaskBoardBundle\User\TaskBoardUserLocator:
        arguments:
            $userClass: '%nowo_task_board.user_class%'
            $managerRegistry: '@?doctrine'
    Nowo\TaskBoardBundle\Service\TaskCommands:
        arguments:
            $managerRegistry: '@?doctrine'
            $rowLock: '@?Nowo\TaskBoardBundle\Service\OrderedRowLockInterface'
            $validator: '@?validator'
    Nowo\TaskBoardBundle\Service\TaskCommandsInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskCommands
        public: true
    Nowo\TaskBoardBundle\Service\TaskBoardAccessInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskBoardIdAccessChecker
        public: true
    Nowo\TaskBoardBundle\Service\TaskBoardQueryInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskBoardQuery
        public: true
    Nowo\TaskBoardBundle\Service\TaskFlowStatsInterface:
        alias: Nowo\TaskBoardBundle\Service\TaskFlowStats
        public: true

    # Since 2.19.0 (Beacon spec 234, FR-031 / FR-045): folders and the restructure service (public for a host's command);
    # the policy port is `restructure.policy` (default: the manage right).
    Nowo\TaskBoardBundle\Folder\TaskBoardRestructureInterface:
        alias: Nowo\TaskBoardBundle\Folder\TaskBoardRestructurer
        public: true
    # Since 2.20.0 (audit PW-D2-L1): the same service, for a caller that passes its channel (the 2.19 port is unchanged).
    Nowo\TaskBoardBundle\Folder\TaskBoardRestructureViaInterface:
        alias: Nowo\TaskBoardBundle\Folder\TaskBoardRestructurer
        public: true
    Nowo\TaskBoardBundle\Folder\TaskBoardRestructurePolicyInterface:
        alias: Nowo\TaskBoardBundle\Folder\ManageRightRestructurePolicy
    Nowo\TaskBoardBundle\Folder\TaskBoardRestructurer:
        arguments:
            $syncEnabled: '%nowo_task_board.sync.enabled%'

    # Since 2.19.0 (Beacon block W): board configuration as data (public for a host's presets).
    Nowo\TaskBoardBundle\Configuration\BoardConfigurationExporter:
        public: true
    Nowo\TaskBoardBundle\Configuration\BoardConfigurationApplier:
        public: true
    Nowo\TaskBoardBundle\Configuration\BoardTemplatesConfigurationInterface:
        alias: Nowo\TaskBoardBundle\Configuration\NoBoardTemplates
    Nowo\TaskBoardBundle\Folder\FolderStatusSets:
        public: true
    Nowo\TaskBoardBundle\Field\TaskCustomFieldManager:
        public: true
        arguments:
            # Since 3.3.0 (audit ZCFv2-L1): only with sync.enabled.
            $reread: '@?Nowo\TaskBoardBundle\Sync\Field\SyncNativeFieldReread'
    # Since 3.3.0: access and erasure of native custom field values (public for the host's data-subject chain).
    Nowo\TaskBoardBundle\Field\TaskCustomFieldPersonalData:
        public: true

    # Since 2.22.0: the menus of the board cards, list rows and column headers (UiKit context menus) and their writes.
    Nowo\TaskBoardBundle\Menu\TaskMenuBuilder:
        arguments:
            $moveEnabled: '%nowo_task_board.move.enabled%'
            $timer: '@?Nowo\TaskBoardBundle\Menu\TaskTimerStarterInterface'

    Nowo\TaskBoardBundle\Twig\TaskMenuTwigExtension:
        arguments:
            $contextMenus: '%nowo_task_board.web_ui.context_menus%'

    Nowo\TaskBoardBundle\Controller\TaskMenuController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_task_board.routes%'
            $timer: '@?Nowo\TaskBoardBundle\Menu\TaskTimerStarterInterface'
            $logger: '@?logger'

    # Since 2.3.0 (spec 217): Move to another board and Duplicate (routes only with move.enabled).
    # Since 3.3.0: the board's Custom fields page (routes only with web_ui.custom_fields_page).
    Nowo\TaskBoardBundle\Controller\TaskCustomFieldController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_task_board.routes%'
            $templates: '%nowo_task_board.templates%'
            $logger: '@?logger'

    Nowo\TaskBoardBundle\Controller\TaskCopyController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_task_board.routes%'

    Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver:
        class: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\TaskImportUserResolverInterface:
        alias: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Jira\JiraCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Trello\TrelloJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskBoard\TaskBoardCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskBoard\TaskBoardJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskImportOrchestrator:
        arguments:
            $importers: !tagged_iterator nowo_task_board.task_importer
            $maxRows: '%nowo_task_board.import.max_rows%'

    # Since 1.22 (audit DL-L4): CSV row and cell limits (`import.*`); the CSV importers get this instance.
    # Since 1.22.1 (audit DL-L6): column and filled-cell limits too.
    Nowo\TaskBoardBundle\Import\Support\DelimitedTableParser:
        arguments:
            $maxRows: '%nowo_task_board.import.max_rows%'
            $maxCellLength: '%nowo_task_board.import.max_cell_length%'
            $maxColumns: '%nowo_task_board.import.max_columns%'
            $maxCells: '%nowo_task_board.import.max_cells%'

    # Since 1.22.1 (audit EB-L3): JSON imports are weighed before they are decoded; the JSON importers get this instance.
    Nowo\TaskBoardBundle\Import\Support\JsonImportGuard:
        arguments:
            $maxNodes: '%nowo_task_board.import.max_json_nodes%'
            $maxRows: '%nowo_task_board.import.max_rows%'

    # Since 1.22: source ids already imported into another board of the tenant (cross-board rule of the import).
    Nowo\TaskBoardBundle\Port\Internal\TaskImportLinkLookupInterface:
        alias: Nowo\TaskBoardBundle\Import\DoctrineTaskImportLinkLookup

    Nowo\TaskBoardBundle\Command\TaskBoardImportCommand: ~

    # Since 2.9.0: fill-only icons of existing boards' default columns (nowo:task-board:apply-default-column-icons).
    Nowo\TaskBoardBundle\Service\DefaultColumnIconFiller:
        arguments:
            $defaultColumns: '%nowo_task_board.board.default_columns%'
            $logger: '@?logger'

    Nowo\TaskBoardBundle\Command\TaskBoardApplyDefaultColumnIconsCommand: ~

    # REQ-UI-001: the Twig functions and globals of the pages.
    Nowo\TaskBoardBundle\Twig\TaskBoardTwigExtension:
        arguments:
            $routes: '%nowo_task_board.routes%'
            $filtersCollapse: '%nowo_task_board.templates.filters_collapse%'
            $filtersFormClass: '%nowo_task_board.templates.filters_form_class%'
            $textRenderer: '@Nowo\TaskBoardBundle\Text\TaskTextRendererInterface'
            $avatars: '@Nowo\TaskBoardBundle\Avatar\TaskMemberAvatars'
            $connectionBadgeTemplate: '%nowo_task_board.templates.connection_badge%'
            $syncBadgeConnectLink: '%nowo_task_board.sync.badge.connect_link%'
            $syncBadgeStyle: '%nowo_task_board.sync.badge.style%'
            $taskTimeBefore: '%nowo_task_board.templates.task_time_before%'
            $pageHeader: '%nowo_task_board.templates.page_header%'
            $boardToolbar: '%nowo_task_board.board.toolbar%'
            $panelToolbar: '%nowo_task_board.task_panel.toolbar%'

    # Since 2.0.0: the layout of the pages (web_ui.layout_template).
    Nowo\TaskBoardBundle\Ui\TaskBoardPages:
        arguments:
            $layoutTemplate: '%nowo_task_board.web_ui.layout_template%'

    # Since 1.19: user text (comments, plain-text descriptions) → HTML; hosts alias the interface to their renderer.
    Nowo\TaskBoardBundle\Text\PlainTaskTextRenderer: ~
    Nowo\TaskBoardBundle\Text\TaskTextRendererInterface:
        alias: Nowo\TaskBoardBundle\Text\PlainTaskTextRenderer

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\TaskBoardBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    # Since 1.10 (tenancy): the tenant of the request and the tenant copies of the manage routes.
    Nowo\TaskBoardBundle\Tenancy\TaskBoardTenantContext:
        arguments:
            $enabled: '%nowo_task_board.tenancy.enabled%'
            $singleBoard: '%nowo_task_board.tenancy.single_board%'

    Nowo\TaskBoardBundle\Routing\TenantPaths:
        arguments:
            $tenantPaths: '%nowo_task_board.tenancy.tenant_paths%'
            $routes: '%nowo_task_board.routes%'
            $enabled: '%nowo_task_board.tenancy.enabled%'

    Nowo\TaskBoardBundle\Service\TaskBoardCreator:
        arguments:
            $defaultColumns: '%nowo_task_board.board.default_columns%'

    # Since 2.2.0 (spec 213): the rules of comments, for every write path.
    Nowo\TaskBoardBundle\Service\TaskCommentPolicy:
        arguments:
            $readersCanComment: '%nowo_task_board.comments.readers_can_comment%'

    # Since 1.25: the erase cursor is signed with the application secret (audit FP-L3).
    Nowo\TaskBoardBundle\Service\TaskBoardEraser:
        arguments:
            $cursorSecret: '%kernel.secret%'

    # Since 1.10: host object links (TaskLinkType::HostObject) resolved by the host's resolvers.
    Nowo\TaskBoardBundle\Link\TaskObjectLinkResolver:
        arguments:
            $resolvers: !tagged_iterator nowo_task_board.object_link_resolver

    # Since 1.23: task member avatars — the host aliases the resolver; the default gives the initial chips.
    Nowo\TaskBoardBundle\Avatar\NullTaskMemberAvatarResolver: ~

    Nowo\TaskBoardBundle\Avatar\TaskMemberAvatarResolverInterface:
        alias: Nowo\TaskBoardBundle\Avatar\NullTaskMemberAvatarResolver

    Nowo\TaskBoardBundle\Avatar\TaskMemberAvatars:
        arguments:
            $resolver: '@Nowo\TaskBoardBundle\Avatar\TaskMemberAvatarResolverInterface'
            $logger: '@?logger'
        tags: [{ name: kernel.reset, method: reset }]

    # Since 2.18.0 (Beacon spec 234): the member badges of a request (TaskBoardExtension sets the provider, or none).
    Nowo\TaskBoardBundle\Member\MemberBadges:
        arguments:
            $provider: ~
            $logger: '@?logger'
        tags: [{ name: kernel.reset, method: reset }]

    # Since 2.11.1 (REQ-RUNTIME-002): clears the request memos at the request, Messenger and console boundaries, also
    # where the services resetter does not run. Lazy iterator of IGNORE_ON_UNINITIALIZED references ('@!'): a boundary
    # never builds a service. TaskBoardExtension adds TaskRecurrenceView / SyncPeopleViewProvider when they are loaded.
    Nowo\TaskBoardBundle\EventListener\TaskBoardRequestBoundarySubscriber:
        autowire: false
        arguments:
            $state: !iterator
                - '@!Nowo\TaskBoardBundle\Avatar\TaskMemberAvatars'
                - '@!Nowo\TaskBoardBundle\Member\MemberBadges'
                - '@!Nowo\TaskBoardBundle\Service\TaskChangeContext'
                - '@!Nowo\TaskBoardBundle\Service\TaskEventDeferral'
        tags:
            - { name: kernel.event_subscriber }

