services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TaskBoardBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../TaskBoardBundle.php'
            - '../../Resources/'
            # Value objects / data carriers are not services (REQ: keep the container free of non-services).
            - '../../Entity/'
            - '../../Dto/'
            - '../../Event/'
            - '../../Enum/'
            - '../../Exception/'
            - '../../ValueObject/'
            - '../../Import/Dto/'
            - '../../Import/TaskImportSource.php'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Bridge/TimeTrack/'
            - '../../EventListener/TimeSpentAggregatorListener.php'
            - '../../Security/TaskBoardAccessCheckerInterface.php'
            - '../../Security/ConfigurableTaskBoardAccessChecker.php'
            - '../../Security/AllowAllTaskBoardAccessChecker.php'
            - '../../Security/TaskBoardTeamMembershipResolverInterface.php'
            - '../../Security/NullTaskBoardTeamMembershipResolver.php'
            - '../../Security/TaskBoardResourceAccessChecker.php'
            - '../../Tenancy/TaskBoardTenant.php'
            - '../../Tenancy/TaskBoardTenantResolverInterface.php'
            - '../../Tenancy/SlugTaskBoardTenantResolver.php'
            - '../../Routing/TenantPathUrlGenerator.php'
            - '../../Assignee/'
            - '../../Link/TaskObjectLinkResolverInterface.php'
            - '../../Link/TaskObjectBadge.php'
            - '../../Comment/MentionCandidate.php'

    Nowo\TaskBoardBundle\Controller\:
        resource: '../../Controller/'
        public: true

    Nowo\TaskBoardBundle\Routing\TaskBoardRouteLoader:
        arguments:
            $routes: '%nowo_task_board.routes%'
            $routePrefix: '%nowo_task_board.route_prefix%'
            $tenancy: '%nowo_task_board.tenancy%'
        tags:
            - { name: routing.loader }

    Nowo\TaskBoardBundle\Controller\TaskBoardManageController:
        public: true
        arguments:
            $routes: '%nowo_task_board.routes%'
            $templates: '%nowo_task_board.templates%'
            $userClass: '%nowo_task_board.user_class%'
            $dashboardRoute: '%nowo_task_board.dashboard_route%'
            $topLevelOnly: '%nowo_task_board.board.top_level_only%'
            $columnIcons: '%nowo_task_board.board.column_icons%'
            $readersCanComment: '%nowo_task_board.comments.readers_can_comment%'

    Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver:
        class: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\TaskImportUserResolverInterface:
        alias: Nowo\TaskBoardBundle\Import\NullTaskImportUserResolver

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Jira\JiraCsvImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\Trello\TrelloJsonImporter:
        tags: [{ name: nowo_task_board.task_importer }]

    Nowo\TaskBoardBundle\Import\TaskImportOrchestrator:
        arguments:
            $importers: !tagged_iterator nowo_task_board.task_importer

    Nowo\TaskBoardBundle\Command\TaskBoardImportCommand: ~

    # REQ-UI-001: Twig globals from templates.layout / templates.css_framework.
    Nowo\TaskBoardBundle\Twig\TaskBoardTwigExtension:
        arguments:
            $layoutTemplate: '%nowo_task_board.templates.layout%'
            $cssFramework: '%nowo_task_board.templates.css_framework%'
            $routes: '%nowo_task_board.routes%'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\TaskBoardBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    # Since 1.10 (tenancy): the tenant of the request and the tenant copies of the manage routes.
    Nowo\TaskBoardBundle\Tenancy\TaskBoardTenantContext:
        arguments:
            $enabled: '%nowo_task_board.tenancy.enabled%'
            $singleBoard: '%nowo_task_board.tenancy.single_board%'

    Nowo\TaskBoardBundle\Routing\TenantPaths:
        arguments:
            $tenantPaths: '%nowo_task_board.tenancy.tenant_paths%'
            $routes: '%nowo_task_board.routes%'
            $enabled: '%nowo_task_board.tenancy.enabled%'

    Nowo\TaskBoardBundle\Service\TaskBoardCreator:
        arguments:
            $defaultColumns: '%nowo_task_board.board.default_columns%'

    # Since 1.10: host object links (TaskLinkType::HostObject) resolved by the host's resolvers.
    Nowo\TaskBoardBundle\Link\TaskObjectLinkResolver:
        arguments:
            $resolvers: !tagged_iterator nowo_task_board.object_link_resolver
