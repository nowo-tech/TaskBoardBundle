# Since 1.23: provider connections and sync — loaded only with `sync.enabled: true`.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Own HTTP clients (never the profiler-traced `http_client`: it records request headers). Not autoconfigured
    # (audit EG-L4): autoconfiguration would hand them the application logger, which logs every URL with its query
    # (signed attachment URLs). The reset tag keeps the DNS cache of the private-network guard per request.
    nowo_task_board.sync.base_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        autoconfigure: false

    nowo_task_board.sync.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@nowo_task_board.sync.base_http_client']
        autoconfigure: false
        tags: [{ name: kernel.reset, method: reset }]

    Nowo\TaskBoardBundle\Sync\Http\SleeperInterface:
        alias: Nowo\TaskBoardBundle\Sync\Http\SystemSleeper

    Nowo\TaskBoardBundle\Sync\Http\SystemSleeper: ~

    Nowo\TaskBoardBundle\Sync\Http\ProviderHttpClient:
        arguments:
            $client: '@nowo_task_board.sync.api_client'
            $timeout: '%nowo_task_board.sync.http.timeout%'
            $maxDuration: '%nowo_task_board.sync.http.max_duration%'
            $maxResponseBytes: '%nowo_task_board.sync.http.max_response_bytes%'
            $maxInlineWait: '%nowo_task_board.sync.http.max_inline_wait%'

    Nowo\TaskBoardBundle\Sync\Content\RemoteContentSanitizer: ~

    Nowo\TaskBoardBundle\Import\ClickUp\ClickUpTaskMapper: ~

    Nowo\TaskBoardBundle\Sync\File\NullUrlGuard: ~

    Nowo\TaskBoardBundle\Sync\File\UrlGuardInterface:
        alias: Nowo\TaskBoardBundle\Sync\File\NullUrlGuard

    Nowo\TaskBoardBundle\Sync\File\RemoteFileFetcher:
        arguments:
            $client: '@nowo_task_board.sync.http_client'
            $maxBytes: '%nowo_task_board.sync.attachments.max_bytes%'
            $allowedMimeTypes: '%nowo_task_board.sync.attachments.allowed_mime_types%'
            $maxRedirects: '%nowo_task_board.sync.attachments.max_redirects%'

    Nowo\TaskBoardBundle\Sync\Provider\TaskProviderRegistry:
        arguments:
            $providers: !tagged_iterator nowo_task_board.task_provider

    Nowo\TaskBoardBundle\Sync\Repository\SyncStore: ~

    Nowo\TaskBoardBundle\Sync\Hook\NullTaskAttachmentStorage: ~
    Nowo\TaskBoardBundle\Sync\Hook\MapInlineImageRewriter: ~
    Nowo\TaskBoardBundle\Sync\Hook\NullSyncLimitChecker: ~

    Nowo\TaskBoardBundle\Sync\Hook\ConnectionCreatorActorResolver:
        arguments:
            $userClass: '%nowo_task_board.user_class%'
            # Since 1.24: set from sync.actor_checker by the extension.
            $userChecker: null

    Nowo\TaskBoardBundle\Sync\SyncTaskWriter:
        arguments:
            $tasks: '@Nowo\TaskBoardBundle\Repository\TaskRepositoryInterface'
            $assigneeProvider: '@?Nowo\TaskBoardBundle\Assignee\TaskAssigneeProviderInterface'
            $translator: '@?translator'
            $storageEnabled: '%nowo_task_board.sync.storage_enabled%'
            $maxFileBytes: '%nowo_task_board.sync.attachments.max_bytes%'

    Nowo\TaskBoardBundle\Sync\TaskBoardSyncService:
        public: true
        arguments:
            $eventDispatcher: '@?event_dispatcher'
            $maxTasksPerRun: '%nowo_task_board.sync.max_tasks_per_run%'
            $maxPagesPerRun: '%nowo_task_board.sync.max_pages_per_run%'
            $maxArchiveRatio: '%nowo_task_board.sync.max_archive_ratio%'
            $historyKeep: '%nowo_task_board.sync.history_keep%'
            $maxBytesPerRun: '%nowo_task_board.sync.attachments.max_bytes_per_run%'

    Nowo\TaskBoardBundle\Sync\Hook\InlineSyncRunner:
        arguments:
            $slicePages: '%nowo_task_board.sync.inline_slice_pages%'

    Nowo\TaskBoardBundle\Sync\View\ConnectionBadgeProvider:
        arguments:
            $security: '@?security.helper'
            $urlGenerator: '@router'
            $routes: '%nowo_task_board.routes%'
            $showProgress: '%nowo_task_board.sync.badge.progress%'
            $pollInterval: '%nowo_task_board.sync.progress.poll_interval_ms%'

    Nowo\TaskBoardBundle\Controller\TaskBoardConnectionController:
        public: true
        arguments:
            $routes: '%nowo_task_board.routes%'
            $templates: '%nowo_task_board.templates%'
            $dashboardRoute: '%nowo_task_board.dashboard_route%'
            $cache: '@?cache.app'
            $containerCacheTtl: '%nowo_task_board.sync.container_cache_ttl%'
            $pollInterval: '%nowo_task_board.sync.progress.poll_interval_ms%'
            $peopleStep: '%nowo_task_board.sync.people.step%'
            $peoplePageSize: '%nowo_task_board.sync.people.page_size%'
        tags: ['controller.service_arguments']

    Nowo\TaskBoardBundle\Command\TaskBoardSyncCommand: ~

    # Since 1.25: the people directory (people, creator, assignees, watchers, comment authors), checklists, statuses,
    # tracked time through the host's sink, the pre-scans and re-association. Arguments that come from the config are
    # set by the extension (registerSyncPeople()).
    Nowo\TaskBoardBundle\Sync\People\TaskSyncPersonRepository:
        public: true

    Nowo\TaskBoardBundle\Sync\Hook\DefaultSyncPersonResolver:
        arguments:
            $userClass: '%nowo_task_board.user_class%'
            $assigneeProvider: '@?Nowo\TaskBoardBundle\Assignee\TaskAssigneeProviderInterface'

    Nowo\TaskBoardBundle\Sync\People\TaskSyncPeopleDirectoryService:
        public: true
        arguments:
            $eventDispatcher: '@?event_dispatcher'

    Nowo\TaskBoardBundle\Sync\People\PeopleProjection: ~
    Nowo\TaskBoardBundle\Sync\People\SyncPeopleWriter: ~

    Nowo\TaskBoardBundle\Sync\People\TaskSyncPeopleReassigner:
        public: true
        arguments:
            $eventDispatcher: '@?event_dispatcher'

    Nowo\TaskBoardBundle\Sync\People\TaskSyncPeopleProjector:
        public: true

    # Since 1.27.0 (TB-SYNC-2): the People page / step. $inviter, $candidateLimit, $reapplySeconds come from the extension.
    Nowo\TaskBoardBundle\Sync\People\PeopleMappingService:
        public: true
        arguments:
            $eventDispatcher: '@?event_dispatcher'

    Nowo\TaskBoardBundle\Sync\People\TaskSyncPeopleScanner:
        public: true

    Nowo\TaskBoardBundle\Sync\TaskSyncSourceScanner:
        public: true

    Nowo\TaskBoardBundle\Sync\People\TaskSyncCommentLegacyAuthorMigrator:
        public: true

    Nowo\TaskBoardBundle\Sync\SyncChecklistWriter: ~

    # Since 1.27.0 (TB-SYNC-3): typed custom fields and their view.
    Nowo\TaskBoardBundle\Sync\Field\SyncCustomFieldWriter: ~
    Nowo\TaskBoardBundle\Sync\SyncTaskDetailsWriter: ~
    Nowo\TaskBoardBundle\Sync\View\SyncFieldViewProvider: ~

    Nowo\TaskBoardBundle\Sync\Time\TimeEntryPhase:
        arguments:
            $sink: null

    Nowo\TaskBoardBundle\Sync\View\SyncPeopleViewProvider:
        arguments:
            $translator: '@?translator'
            $userClass: '%nowo_task_board.user_class%'
