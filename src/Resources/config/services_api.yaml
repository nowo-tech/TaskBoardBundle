# Since 2.2.0 (spec 213): the Task API, loaded only with `api.enabled: true`.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TaskBoardBundle\Api\Hook\DenyingTaskApiRateLimiter: ~
    Nowo\TaskBoardBundle\Api\Hook\DenyingTaskApiPlanGate: ~
    Nowo\TaskBoardBundle\Api\Hook\DenyingTaskApiTimeEntries: ~
    Nowo\TaskBoardBundle\Api\Hook\EmptyTaskApiWorkspace: ~
    Nowo\TaskBoardBundle\Api\Hook\EmptyTaskApiUsers: ~
    Nowo\TaskBoardBundle\Api\Hook\EmptyTaskApiMembers: ~
    Nowo\TaskBoardBundle\Api\Hook\AuthorOnlyTaskApiCommentEditPolicy: ~
    Nowo\TaskBoardBundle\Api\Hook\DenyingTaskApiAttachments: ~

    Nowo\TaskBoardBundle\Api\Security\TaskApiRequestListener:
        arguments:
            $prefix: '%nowo_task_board.api.prefix%'
            # Since 2.22.0: the shared lock-conflict policy (409 by default); absent when the host did not register
            # nowo-tech/transaction-doctrine's bundle (the listener then answers 409 + Retry-After: 1).
            $conflictPolicy: '@?nowo_transaction_doctrine.conflict_response_policy'
            $commits: '@Nowo\TaskBoardBundle\Api\Security\TaskApiCommitWatermark'

    # Since 2.22.0 (audit SU-L1): the durable writes of the process (nowo-tech/transaction-doctrine's ledger and DBAL
    # middleware, on the connections), so an API request that committed part of its work answers CONFLICT_002. With
    # transaction-doctrine's bundle and its commit detection on, TaskBoardPortsPass uses that bundle's ledger instead.
    nowo_task_board.api.commit_ledger:
        class: Nowo\TransactionDoctrine\WriteUnit\CommitLedger
    nowo_task_board.api.commit_tracking_middleware:
        class: Nowo\TransactionDoctrine\WriteUnit\Dbal\CommitTrackingMiddleware
        arguments: ['@nowo_task_board.api.commit_ledger']
        tags: ['doctrine.middleware']
    Nowo\TaskBoardBundle\Api\Security\TaskApiCommitWatermark:
        arguments: ['@nowo_task_board.api.commit_ledger']

    Nowo\TaskBoardBundle\Api\Serializer\TaskApiIdentitySerializer: ~
    Nowo\TaskBoardBundle\Api\Serializer\TaskApiReadSerializer: ~

    Nowo\TaskBoardBundle\Api\Repository\TaskApiQueryRepository:
        arguments:
            $syncEnabled: '%nowo_task_board.sync.enabled%'

    # Public: any in-process caller reaches the operations and the guard without HTTP.
    Nowo\TaskBoardBundle\Api\Security\TaskApiGuard:
        public: true

    Nowo\TaskBoardBundle\Api\Operation\TaskApiReadOperations:
        public: true
        arguments:
            # Since 2.16.0 (spec 234, FR-026).
            $search: '@Nowo\TaskBoardBundle\Search\TaskTextSearchInterface'
            $searchMaxMatches: '%nowo_task_board.search.max_matches%'

    Nowo\TaskBoardBundle\Api\Controller\TaskApiIdentityController:
        public: true
        # REQ-SF-004 rule 7: #[Route] attributes, not autoconfigured (see services.yaml).
        autoconfigure: false
        tags: ['controller.service_arguments']

    Nowo\TaskBoardBundle\Api\Controller\TaskApiReadController:
        public: true
        # REQ-SF-004 rule 7: #[Route] attributes, not autoconfigured (see services.yaml).
        autoconfigure: false
        tags: ['controller.service_arguments']
        arguments:
            $listsIncludeFolders: '%nowo_task_board.api.lists_include_folders%'

    Nowo\TaskBoardBundle\Api\Controller\TaskApiWriteController:
        public: true
        # REQ-SF-004 rule 7: #[Route] attributes, not autoconfigured (see services.yaml).
        autoconfigure: false
        tags: ['controller.service_arguments']
        arguments:
            $maxBodyBytes: '%nowo_task_board.api.max_body_bytes%'

    Nowo\TaskBoardBundle\Api\Operation\TaskApiAudit:
        arguments:
            $quotaListenerRequired: '%nowo_task_board.api.quota_listener_required%'

    Nowo\TaskBoardBundle\Api\Operation\TaskApiTaskOperations:
        public: true

    # Since 2.16.0 (spec 234): the transaction of an update with a base revision and of a bulk update.
    Nowo\TaskBoardBundle\Api\Operation\TaskApiTransaction:
        arguments:
            $managerRegistry: '@?doctrine'
            $events: '@Nowo\TaskBoardBundle\Service\TaskEventDeferral'

    Nowo\TaskBoardBundle\Api\Operation\TaskApiChecklistOperations:
        public: true

    Nowo\TaskBoardBundle\Api\Operation\TaskApiTimeOperations:
        public: true

    Nowo\TaskBoardBundle\Api\Operation\TaskApiBoardOperations:
        public: true
        arguments:
            $columnIconIds: '%nowo_task_board.board.column_icon_ids%'

    # Since 2.19.0 (Beacon spec 234): folders.
    Nowo\TaskBoardBundle\Api\Operation\TaskApiFolderOperations:
        public: true

    Nowo\TaskBoardBundle\Api\Controller\TaskApiManagementController:
        public: true
        # REQ-SF-004 rule 7: #[Route] attributes, not autoconfigured (see services.yaml).
        autoconfigure: false
        tags: ['controller.service_arguments']
        arguments:
            $maxBodyBytes: '%nowo_task_board.api.max_body_bytes%'

    # Since 2.2.0: selectable as `api.hooks.time_entries` by a host without its own time store.
    Nowo\TaskBoardBundle\Api\Hook\ManualTaskApiTimeEntries: ~

    Nowo\TaskBoardBundle\Api\Security\TaskApiIdempotencyListener: ~

    Nowo\TaskBoardBundle\Api\Command\TaskApiPurgeIdempotencyCommand: ~
