task_board.import.help.intro_board: "Un’importazione aggiunge a questa bacheca attività da un file: ogni riga (scheda o issue) diventa un’attività nella colonna del suo stato e la gerarchia del file diventa sottoattività."
task_board.import.help.intro_task: "Importare in un’attività rende le attività del file sue sottoattività: le righe senza padre dipendono da questa attività, le altre dalla riga padre. Vengono create anche le relazioni del Gantt."
task_board.import.help.taskboard_title: "CSV / JSON della bacheca (consigliato)"
task_board.import.help.taskboard_intro: "L’unico formato che porta date di inizio e relazioni del Gantt. Un CSV con riga di intestazione (virgola o punto e virgola), oppure JSON: un elenco di attività che possono annidare le figlie in \"subtasks\"."
