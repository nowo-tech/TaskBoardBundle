task_board.import.help.dependencies: "In depends_on, \"api\" significa che questa attività attende api (bloccata da essa). Scrivi \"api:blocks\", \"api:related\" o \"api:duplicates\" per le altre relazioni. Una relazione verso una riga assente dal file, duplicata o che chiuderebbe un ciclo viene saltata con un avviso."
