task_board.import.error.too_many_cells: "The file has more than %max% cells; an import takes at most %max%."
task_board.import.error.json_too_large: "The JSON file is too large to import (its weight is over %max%; an administrator can raise the limit)."
task_board.import.help.options: "Importing again is safe: a row imported before (same id from the same tool or, without an id, same parent, title and creation date) updates its task with the file's values instead of creating a copy, and fields the file leaves empty keep the values set here. Rows already imported into another board are skipped. Files up to 20 MB; a very large or very wide export can still exceed an import limit set by the administrator (the error names it)."
