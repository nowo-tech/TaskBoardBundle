task_board.import.help.open: "How to import"
task_board.import.help.modal_title: "Importing tasks"
task_board.import.help.intro_board: "An import adds tasks to this board from a file: each row (or card, or issue) becomes a task in the column named by its status, and the hierarchy of the file becomes subtasks."
task_board.import.help.intro_task: "Importing into a task makes the file's tasks subtasks of it: the rows without a parent hang from this task, the others from their parent row. Their Gantt relations are created too."
task_board.import.help.taskboard_title: "Task board CSV / JSON (recommended)"
task_board.import.help.taskboard_intro: "The only format that carries start dates and Gantt relations. A CSV with a header row (comma or semicolon), or JSON: a list of tasks, where a task may nest its children in \"subtasks\"."
task_board.import.help.column: "Column"
task_board.import.help.meaning: "What it holds"
task_board.import.help.col_id: "Your own id for the row, used by parent and depends_on. Optional, but needed to link rows."
task_board.import.help.col_parent: "The id of the parent row: this task becomes its subtask (any depth)."
task_board.import.help.col_title: "The task title. Required: rows without one are skipped."
task_board.import.help.col_description: "The description (plain text)."
task_board.import.help.col_status: "The column name; a missing column is created when the option is ticked."
task_board.import.help.col_priority: "low, normal, high or urgent."
task_board.import.help.col_assignee: "The e-mail of a person who can be assigned."
task_board.import.help.col_start: "Start date, YYYY-MM-DD (the left end of the Gantt bar)."
task_board.import.help.col_due: "Due date, YYYY-MM-DD."
task_board.import.help.col_estimate: "The estimate in minutes, or like 1h30m."
task_board.import.help.col_tags: "Tags separated by ; or ,."
task_board.import.help.col_depends_on: "Gantt relations: ids of other rows, separated by ; or ,."
task_board.import.help.dependencies: "In depends_on, \"api\" means this task waits for api (blocked by it). Write \"api:blocks\", \"api:related\" or \"api:duplicates\" for the other relations. A relation to a row that is not in the file, a duplicate or one that would close a loop is skipped with a warning."
task_board.import.help.example_csv: "Example (CSV)"
task_board.import.help.example_json: "Example (JSON)"
task_board.import.help.others_title: "Exports from other tools"
task_board.import.help.source_clickup_csv: "Tasks of a ClickUp List or Table view exported as CSV (Task Name, Status, Priority, Assignees, Start Date, Due Date, Date Created, Task ID, Dependencies / Waiting On / Blocking; Parent ID builds subtasks)."
task_board.import.help.source_clickup_json: "Tasks from the ClickUp API or a JSON export (name, status, priority, assignees, due date, parent)."
task_board.import.help.source_jira_csv: "Jira issues exported as CSV from the issue search (Summary, Status, Priority, Assignee, Due Date, Issue key; Parent key builds subtasks)."
task_board.import.help.source_trello_json: "A Trello board exported as JSON (Menu → Print and export → JSON): cards become tasks, lists become columns, checklists become subtasks."
