task_board.import.help.modal_title: "Importar tareas"
task_board.import.help.intro_board: "Una importación añade tareas a este tablero desde un fichero: cada fila (tarjeta o incidencia) se convierte en una tarea en la columna que indica su estado, y la jerarquía del fichero se convierte en subtareas."
task_board.import.help.intro_task: "Importar en una tarea convierte las tareas del fichero en subtareas suyas: las filas sin padre cuelgan de esta tarea y las demás de su fila padre. También se crean sus relaciones de Gantt."
task_board.import.help.taskboard_title: "CSV / JSON del tablero de tareas (recomendado)"
task_board.import.help.taskboard_intro: "El único formato que lleva fechas de inicio y relaciones de Gantt. Un CSV con fila de cabecera (coma o punto y coma), o JSON: una lista de tareas en la que cada tarea puede anidar sus hijas en \"subtasks\"."
task_board.import.help.column: "Columna"
task_board.import.help.meaning: "Qué contiene"
task_board.import.help.col_id: "Un id propio de la fila, usado por parent y depends_on. Opcional, pero necesario para relacionar filas."
task_board.import.help.col_parent: "El id de la fila padre: esta tarea pasa a ser su subtarea (a cualquier profundidad)."
task_board.import.help.col_title: "El título de la tarea. Obligatorio: las filas sin título se ignoran."
task_board.import.help.col_description: "La descripción (texto plano)."
task_board.import.help.col_status: "El nombre de la columna; si no existe se crea cuando la opción está marcada."
task_board.import.help.col_priority: "low, normal, high o urgent."
task_board.import.help.col_assignee: "El correo de una persona que se pueda asignar."
task_board.import.help.col_start: "Fecha de inicio, AAAA-MM-DD (el extremo izquierdo de la barra del Gantt)."
task_board.import.help.col_due: "Fecha límite, AAAA-MM-DD."
task_board.import.help.col_estimate: "La estimación en minutos, o como 1h30m."
task_board.import.help.col_tags: "Etiquetas separadas por ; o ,."
task_board.import.help.col_depends_on: "Relaciones de Gantt: ids de otras filas, separados por ; o ,."
task_board.import.help.dependencies: "En depends_on, \"api\" significa que esta tarea espera a api (bloqueada por ella). Escribe \"api:blocks\", \"api:related\" o \"api:duplicates\" para las otras relaciones. Una relación con una fila que no está en el fichero, duplicada o que cerraría un ciclo se omite con un aviso."
