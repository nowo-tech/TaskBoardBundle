task_board.import.help.options: "Réimporter est sans risque : une ligne déjà importée (même identifiant du même outil ou, sans identifiant, même parent, même titre et même date de création) met à jour sa tâche avec les valeurs du fichier au lieu de la dupliquer, et les champs laissés vides par le fichier gardent les valeurs saisies ici. Les lignes déjà importées dans un autre tableau sont ignorées. Fichiers jusqu’à 20 Mo ; un export très volumineux ou très large peut encore dépasser une limite d’import fixée par l’administrateur (l’erreur indique laquelle)."
