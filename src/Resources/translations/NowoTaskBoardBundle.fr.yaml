task_board.import.help.meaning: "Contenu"
task_board.import.help.col_id: "Votre identifiant de ligne, utilisé par parent et depends_on. Facultatif, mais nécessaire pour relier des lignes."
task_board.import.help.col_parent: "L’identifiant de la ligne parente : cette tâche devient sa sous-tâche (à toute profondeur)."
task_board.import.help.col_title: "Le titre de la tâche. Obligatoire : les lignes sans titre sont ignorées."
task_board.import.help.col_description: "La description (texte brut)."
task_board.import.help.col_status: "Le nom de la colonne ; une colonne absente est créée si l’option est cochée."
task_board.import.help.col_priority: "low, normal, high ou urgent."
task_board.import.help.col_assignee: "L’e-mail d’une personne assignable."
task_board.import.help.col_start: "Date de début, AAAA-MM-JJ (bord gauche de la barre du Gantt)."
task_board.import.help.col_due: "Date d’échéance, AAAA-MM-JJ."
task_board.import.help.col_estimate: "L’estimation en minutes, ou comme 1h30m."
task_board.import.help.col_tags: "Étiquettes séparées par ; ou ,."
task_board.import.help.col_depends_on: "Relations de Gantt : identifiants d’autres lignes, séparés par ; ou ,."
task_board.import.help.dependencies: "Dans depends_on, \"api\" signifie que cette tâche attend api (bloquée par elle). Écrivez \"api:blocks\", \"api:related\" ou \"api:duplicates\" pour les autres relations. Une relation vers une ligne absente du fichier, un doublon ou une relation qui fermerait une boucle est ignorée avec un avertissement."
task_board.import.help.example_csv: "Exemple (CSV)"
