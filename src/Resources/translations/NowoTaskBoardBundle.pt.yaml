task_board.import.help.open: "Como importar"
task_board.import.help.modal_title: "Importar tarefas"
task_board.import.help.intro_board: "Uma importação acrescenta tarefas a este quadro a partir de um ficheiro: cada linha (cartão ou issue) passa a ser uma tarefa na coluna do seu estado, e a hierarquia do ficheiro passa a subtarefas."
task_board.import.help.intro_task: "Importar numa tarefa torna as tarefas do ficheiro suas subtarefas: as linhas sem pai ficam nesta tarefa e as restantes na sua linha pai. As relações do Gantt também são criadas."
task_board.import.help.taskboard_title: "CSV / JSON do quadro de tarefas (recomendado)"
task_board.import.help.taskboard_intro: "O único formato com datas de início e relações do Gantt. Um CSV com linha de cabeçalho (vírgula ou ponto e vírgula), ou JSON: uma lista de tarefas que podem aninhar as filhas em \"subtasks\"."
task_board.import.help.column: "Coluna"
task_board.import.help.meaning: "Conteúdo"
task_board.import.help.col_id: "Um id próprio da linha, usado por parent e depends_on. Opcional, mas necessário para ligar linhas."
task_board.import.help.col_parent: "O id da linha pai: esta tarefa passa a ser sua subtarefa (a qualquer profundidade)."
task_board.import.help.col_title: "O título da tarefa. Obrigatório: as linhas sem título são ignoradas."
task_board.import.help.col_description: "A descrição (texto simples)."
task_board.import.help.col_status: "O nome da coluna; se não existir é criada quando a opção está marcada."
task_board.import.help.col_priority: "low, normal, high ou urgent."
task_board.import.help.col_assignee: "O e-mail de uma pessoa que se possa atribuir."
task_board.import.help.col_start: "Data de início, AAAA-MM-DD (extremo esquerdo da barra do Gantt)."
task_board.import.help.col_due: "Data limite, AAAA-MM-DD."
task_board.import.help.col_estimate: "A estimativa em minutos, ou como 1h30m."
task_board.import.help.col_tags: "Etiquetas separadas por ; ou ,."
task_board.import.help.col_depends_on: "Relações do Gantt: ids de outras linhas, separados por ; ou ,."
task_board.import.help.dependencies: "Em depends_on, \"api\" significa que esta tarefa espera por api (bloqueada por ela). Escreva \"api:blocks\", \"api:related\" ou \"api:duplicates\" para as outras relações. Uma relação com uma linha que não está no ficheiro, duplicada ou que fecharia um ciclo é ignorada com um aviso."
task_board.import.help.example_csv: "Exemplo (CSV)"
task_board.import.help.example_json: "Exemplo (JSON)"
task_board.import.help.others_title: "Exportações de outras ferramentas"
task_board.import.help.source_clickup_csv: "As tarefas de uma vista Lista ou Tabela do ClickUp exportadas em CSV (Task Name, Status, Priority, Assignee, Due Date, Task ID; Parent ID cria subtarefas)."
task_board.import.help.source_clickup_json: "Tarefas da API do ClickUp ou de uma exportação JSON (nome, estado, prioridade, responsáveis, data limite, pai)."
task_board.import.help.source_jira_csv: "Issues do Jira exportadas em CSV a partir da pesquisa (Summary, Status, Priority, Assignee, Due Date, Issue key; Parent key cria subtarefas)."
task_board.import.help.source_trello_json: "Um quadro do Trello exportado em JSON (Menu → Imprimir e exportar → JSON): os cartões passam a tarefas, as listas a colunas e as checklists a subtarefas."
task_board.import.help.options: "As linhas já importadas (mesmo id da mesma origem) são ignoradas enquanto \"Ignorar tarefas já importadas\" estiver marcado, por isso o mesmo ficheiro pode ser importado de novo sem duplicar. Ficheiros até 20 MB."
