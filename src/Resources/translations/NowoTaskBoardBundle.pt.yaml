task_board.import.help.col_depends_on: "Relações do Gantt: ids de outras linhas, separados por ; ou ,."
task_board.import.help.dependencies: "Em depends_on, \"api\" significa que esta tarefa espera por api (bloqueada por ela). Escreva \"api:blocks\", \"api:related\" ou \"api:duplicates\" para as outras relações. Uma relação com uma linha que não está no ficheiro, duplicada ou que fecharia um ciclo é ignorada com um aviso."
