task_board.import.help.options: "Ein erneuter Import ist sicher: eine bereits importierte Zeile (gleiche ID aus demselben Tool oder, ohne ID, gleiche Elternaufgabe, gleicher Titel und gleiches Erstelldatum) aktualisiert ihre Aufgabe mit den Werten der Datei statt eine Kopie anzulegen; Felder, die die Datei leer lässt, behalten die hier gesetzten Werte. Bereits in ein anderes Board importierte Zeilen werden übersprungen. Dateien bis 20 MB; ein sehr großer oder sehr breiter Export kann trotzdem ein vom Administrator gesetztes Importlimit überschreiten (die Fehlermeldung nennt es)."
