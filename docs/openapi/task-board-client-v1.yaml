# TaskBoard client API v1 (Beacon Desktop tasks module, since 3.4.0). Kept in step with the routes by ClientApiOpenApiTest.
openapi: 3.1.0
info:
  title: TaskBoardBundle client API
  version: 3.5.0
  description: 'A stateless client API for a first-party app (Beacon Desktop), off unless client_api.principal_resolver is set. Paths are relative to <client_api.prefix>/v1 (default /api/task-board/v1). Every request names its context (X-Beacon-Context, client_api.context_header). Errors are {ok: false, error, ...}. See docs/CLIENT-API.md.'
servers:
  - url: /api/task-board/v1
security:
  - bearer: []
paths:
  '/boards':
    get:
      operationId: boards
      summary: 'The context''s boards the person may view, by name'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: q, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Boards'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/boards/{boardId}':
    parameters:
      - {name: boardId, in: path, required: true, schema: {type: string}}
    get:
      operationId: board
      summary: 'One board, the people the caller may assign there and the tags in use'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BoardDetail'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/boards/{boardId}/tasks':
    parameters:
      - {name: boardId, in: path, required: true, schema: {type: string}}
    get:
      operationId: board_tasks
      summary: 'One column''s cards in board order (column=) or the list view (sort=), with filters'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: column, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [position, due, priority, updated, number], default: position}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: assignee, in: query, schema: {type: string, enum: [me]}}
        - {name: priority, in: query, description: Repeatable, schema: {type: string, enum: [low, normal, high, urgent]}}
        - {name: tag, in: query, description: Repeatable, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 128}}
        - {name: due, in: query, schema: {type: string, enum: [overdue, today, week, none]}}
        - {name: parent, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/changes':
    get:
      operationId: changes
      summary: 'Tasks of the context changed since the cursor (polling; no tombstones)'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: since, in: query, description: 'nextCursor of the previous poll; none starts at now', schema: {type: string, maxLength: 3072}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Changes'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/me':
    get:
      operationId: me
      summary: 'The caller, the contexts and what the API offers'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/my-tasks':
    get:
      operationId: my_tasks
      summary: 'The caller''s open tasks as assignee (review: as reviewer), by due date, priority and id'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: bucket, in: query, schema: {type: string, enum: [overdue, today, upcoming, no_date, review, all], default: all}}
        - {name: today, in: query, description: 'The client''s local date (YYYY-MM-DD), within a day of the server''s UTC date', schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MyTasks'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/people':
    get:
      operationId: people
      summary: 'People the caller may assign on a board (prefix match, 20 at most)'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: board, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/People'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/questions/waiting':
    get:
      operationId: questions_waiting
      summary: 'Open questions addressed to the caller in the context (100 at most)'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/tasks':
    post:
      operationId: task_create
      summary: 'Quick create (Idempotency-Key required)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTask'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      operationId: task
      summary: 'A task''s detail (ETag: its revision); 123 or #123 with board= looks it up by number'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: board, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDetail'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    patch:
      operationId: task_update
      summary: 'Change fields (If-Match required)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchTask'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/checklist-items':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    post:
      operationId: checklist_item_create
      summary: 'A checklist item (Idempotency-Key required)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChecklistItem'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/checklist-items/{itemId}':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
      - {name: itemId, in: path, required: true, schema: {type: string}}
    patch:
      operationId: checklist_item_update
      summary: 'Rename or tick an item (the item''s If-Match)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChecklistItemPatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/comments':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      operationId: task_comments
      summary: 'Comments, newest first (bodies as tokens/1)'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: before, in: query, description: 'nextCursor of the previous page', schema: {type: string, maxLength: 3072}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Comments'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/members/{userId}':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
      - {name: userId, in: path, required: true, schema: {type: string}}
    put:
      operationId: task_member_put
      summary: 'Add a member with a role (If-Match required)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemberRole'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      operationId: task_member_delete
      summary: 'Remove every role of a member (If-Match required)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/move':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    post:
      operationId: task_move
      summary: 'Move between or within columns (If-Match; * inside the column)'
      description: 'Scope: task-board:write.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveTask'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWritten'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/questions':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      operationId: task_questions
      summary: 'The task''s questions (task_questions.enabled), context as tokens/1, waitingForMe'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {name: state, in: query, schema: {type: string, enum: [open, answered, withdrawn]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  '/tasks/{taskId}/subtasks':
    parameters:
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      operationId: task_subtasks
      summary: 'One level of subtasks, board order'
      description: 'Scope: task-board:read.'
      parameters:
        - {$ref: '#/components/parameters/Context'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: 'A device token of the host''s tasks family (task-board:read, task-board:write).'}
  parameters:
    Context: {name: X-Beacon-Context, in: header, description: 'personal or org:<uuid> (required unless the token is bound to a context)', schema: {type: string, maxLength: 128}}
    Cursor: {name: cursor, in: query, description: 'nextCursor of the previous page (opaque, sealed)', schema: {type: string, maxLength: 3072}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 255}}
    IfMatch: {name: If-Match, in: header, required: true, description: 'The revision ("<n>"); * only for a reorder inside one column', schema: {type: string}}
  responses:
    Error:
      description: 'A refusal: invalid_context, context_required, invalid_cursor, invalid_limit, invalid_json, invalid_field (field), invalid_date, search_too_broad; invalid_token; insufficient_scope, module_forbidden (3.5; message, module=tasks; the host signalled a lost Tasks permission; no WWW-Authenticate), context_forbidden, forbidden, plan_limit (reason), transition_refused (policyCode, message); not_found; conflict (currentRevision), parent_refused (reason), idempotency_mismatch, idempotency_in_flight, unavailable (code, Retry-After), partial (code); source_not_visible; precondition_required; rate_limited (Retry-After); audit_unavailable, idempotency_unavailable; server_error'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error: {type: string}
        field: {type: [string, 'null']}
        currentRevision: {type: integer}
        policyCode: {type: string}
        message: {type: string}
        module: {type: string, description: '3.5: module_forbidden only: tasks.'}
        reason: {type: string}
        code: {type: string}
    Person:
      type: object
      required: [id, name, initials, avatarUrl]
      properties:
        id: {type: string}
        name: {type: string}
        initials: {type: string}
        avatarUrl: {type: [string, 'null']}
    Context:
      type: object
      properties: {key: {type: string}, label: {type: string}}
    Me:
      type: object
      properties:
        apiVersion: {const: 1}
        user: {oneOf: [{$ref: '#/components/schemas/Person'}, {type: 'null'}]}
        scopes: {type: array, items: {type: string}}
        context: {$ref: '#/components/schemas/Context'}
        contexts: {type: array, items: {$ref: '#/components/schemas/Context'}}
        features: {type: object, additionalProperties: true}
        limits: {type: object, additionalProperties: true}
        enums: {type: object, additionalProperties: true}
    Column:
      type: object
      properties: {id: {type: string}, name: {type: string}, color: {type: [string, 'null']}, icon: {type: [string, 'null']}, type: {type: string, enum: [open, custom, done, closed]}, humansOnly: {type: boolean}}
    Board:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        icon: {type: [string, 'null']}
        color: {type: 'null'}
        archived: {const: false}
        group: {type: [object, 'null'], properties: {type: {type: string, enum: [space, folder]}, id: {type: string}, label: {type: string}}}
        columns: {type: array, items: {$ref: '#/components/schemas/Column'}}
        counts: {type: object, description: 'GET boards/{id} only: the open tasks the reader may open', properties: {open: {type: integer}, capped: {type: boolean}}}
        permissions: {type: object, properties: {canCreate: {type: boolean}, canMove: {type: boolean}}}
    Boards:
      type: object
      properties: {boards: {type: array, items: {$ref: '#/components/schemas/Board'}}, nextCursor: {type: [string, 'null']}}
    BoardDetail:
      type: object
      properties:
        board:
          allOf:
            - {$ref: '#/components/schemas/Board'}
            - {type: object, properties: {people: {type: array, items: {$ref: '#/components/schemas/Person'}}, tags: {type: array, items: {type: string}}, templates: {type: array, maxItems: 0}}}
    TaskCard:
      type: object
      properties:
        id: {type: string}
        number: {type: [integer, 'null']}
        title: {type: string}
        boardId: {type: string}
        column: {type: [object, 'null']}
        priority: {type: string, enum: [low, normal, high, urgent]}
        color: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        startAt: {type: [string, 'null'], format: date-time}
        dueAt: {type: [string, 'null'], format: date-time}
        allDay: {type: boolean}
        assignees: {type: array, items: {$ref: '#/components/schemas/Person'}}
        subtaskSummary: {type: object, properties: {total: {type: integer}, done: {type: integer}}}
        checklistSummary: {type: object, properties: {total: {type: integer}, done: {type: integer}}}
        openQuestions: {type: integer}
        waitingForMe: {type: boolean}
        comments: {type: integer}
        estimateMinutes: {type: [integer, 'null']}
        timeSpentMinutes: {type: integer}
        archived: {type: boolean}
        completed: {type: boolean}
        revision: {type: integer}
        updatedAt: {type: string, format: date-time}
    Tokens:
      type: object
      description: 'tokens/1 (shared with ChatKit''s client API): blocks paragraph, heading, quote, list (checked), code, rule; tokens text (marks), break, code, link, reference (visible), image (visible)'
      properties: {format: {const: tokens/1}, blocks: {type: array, items: {type: object}}, truncated: {const: true, description: 'Present when the text was cut at 64 KB'}}
    TaskDetail:
      type: object
      properties:
        task:
          allOf:
            - {$ref: '#/components/schemas/TaskCard'}
            - type: object
              properties:
                description: {$ref: '#/components/schemas/Tokens'}
                parent: {type: [object, 'null']}
                members: {type: array, items: {type: object}}
                checklists: {type: array, items: {type: object}}
                links: {type: array, items: {type: object}}
                dependencies: {type: array, items: {type: object}}
                questions: {type: object}
                createdBy: {oneOf: [{$ref: '#/components/schemas/Person'}, {type: 'null'}]}
                updatedBy: {oneOf: [{$ref: '#/components/schemas/Person'}, {type: 'null'}]}
                channel: {type: [string, 'null']}
                createdAt: {type: string, format: date-time}
                permissions: {type: object}
                webUrl: {type: [string, 'null']}
    TaskWritten:
      allOf:
        - {$ref: '#/components/schemas/TaskDetail'}
        - {type: object, properties: {itemId: {type: string}, itemRevision: {type: integer}}}
    TaskPage:
      type: object
      properties: {tasks: {type: array, items: {$ref: '#/components/schemas/TaskCard'}}, nextCursor: {type: [string, 'null']}}
    MyTasks:
      allOf:
        - {$ref: '#/components/schemas/TaskPage'}
        - {type: object, properties: {counts: {type: object, properties: {overdue: {type: integer}, today: {type: integer}, upcoming: {type: integer}, review: {type: integer}}}}}
    Comments:
      type: object
      properties:
        comments: {type: array, items: {type: object, properties: {id: {type: string}, author: {oneOf: [{$ref: '#/components/schemas/Person'}, {type: 'null'}]}, body: {$ref: '#/components/schemas/Tokens'}, createdAt: {type: string}, editedAt: {type: [string, 'null']}, canEdit: {type: boolean}}}}
        nextCursor: {type: [string, 'null']}
    Questions:
      type: object
      properties: {questions: {type: array, items: {type: object}}}
    People:
      type: object
      properties: {people: {type: array, items: {$ref: '#/components/schemas/Person'}}}
    Changes:
      type: object
      properties:
        changes: {type: array, items: {type: object, properties: {taskId: {type: string}, boardId: {type: string}, revision: {type: integer}}}}
        nextCursor: {type: string}
        reset: {type: boolean}
    CreateTask:
      type: object
      required: [boardId, title]
      additionalProperties: false
      properties:
        boardId: {type: string}
        columnId: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        priority: {type: string, enum: [low, normal, high, urgent]}
        dueAt: {type: [string, 'null'], format: date-time}
        startAt: {type: [string, 'null'], format: date-time}
        allDay: {type: boolean}
        estimateMinutes: {type: [integer, 'null'], minimum: 0}
        tags: {type: array, items: {type: string}, maxItems: 20}
        assignees: {type: array, items: {type: string}, description: 'me or public ids'}
        parentId: {type: string}
        templateId: {type: string, description: 'Not in 3.4.0 (400 invalid_field)'}
        source: {type: object, required: [type], additionalProperties: {type: string, maxLength: 128}}
    PatchTask:
      type: object
      additionalProperties: false
      properties:
        title: {type: string}
        description: {type: [string, 'null']}
        priority: {type: string, enum: [low, normal, high, urgent]}
        color: {type: [string, 'null']}
        tags: {type: array, items: {type: string}, maxItems: 20}
        dueAt: {type: [string, 'null'], format: date-time}
        startAt: {type: [string, 'null'], format: date-time}
        allDay: {type: boolean}
        estimateMinutes: {type: [integer, 'null'], minimum: 0}
        archived: {type: boolean}
    MoveTask:
      type: object
      required: [columnId]
      additionalProperties: false
      properties: {columnId: {type: string}, beforeTaskId: {type: string}, afterTaskId: {type: string}}
    MemberRole:
      type: object
      required: [role]
      additionalProperties: false
      properties: {role: {type: string, enum: [assignee, reviewer, stakeholder, watcher]}}
    ChecklistItem:
      type: object
      required: [checklist, title]
      additionalProperties: false
      properties: {checklist: {type: string, maxLength: 100}, title: {type: string}}
    ChecklistItemPatch:
      type: object
      additionalProperties: false
      properties: {title: {type: string}, done: {type: boolean}}
