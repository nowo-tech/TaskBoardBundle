        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: Authorization
      description: 'The personal token, bare or as "Bearer <token>". Never in the query string.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '1 to 255 characters. Per token, 24 hours: a retry of the same request gets the first answer (Idempotency-Replayed: true); another request with the key is 409 IDEMP_002.'
      schema: {type: string, maxLength: 255}
  responses:
    Error:
      description: 'Every refusal: {"err", "ECODE"}. 404 ACCESS_001 for anything out of reach.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [err, ECODE]
      properties:
        err: {type: string}
        ECODE:
          type: string
          enum: [OAUTH_017, OAUTH_019, API_001, ACCESS_001, ACCESS_002, TOKEN_001, PLAN_001, PLAN_002, RATE_001, RATE_002, INPUT_001, INPUT_002, LIST_001, LIST_002, TASK_002, LINK_001, LINK_002, FIELD_001, FILE_001, TIME_001, TIME_002, IDEMP_001, IDEMP_002, IDEMP_003, IDEMP_004, AUDIT_001, SERVER_001]
    Warnings:
      type: array
      description: 'Fields nothing read: unknown, or a ClickUp field with no equivalent here (not_supported). Never saved.'
      items: {type: object, properties: {field: {type: string}, reason: {enum: [unknown, not_supported]}}}
    Empty:
      type: object
      properties: {warnings: {$ref: '#/components/schemas/Warnings'}}
    User:
      type: object
      properties: {user: {$ref: '#/components/schemas/Person'}}
    Person:
      type: object
      properties: {id: {type: string}, username: {type: string}, email: {type: [string, 'null']}, color: {type: [string, 'null']}, initials: {type: string}, profilePicture: {type: [string, 'null']}}
    Teams:
      type: object
      properties: {teams: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, color: {type: [string, 'null']}, avatar: {type: [string, 'null']}, members: {type: array}}}}}
    Space:
      type: object
      properties: {id: {type: string}, name: {type: string}, private: {type: boolean}, archived: {type: boolean}, statuses: {type: array}, multiple_assignees: {type: boolean}, features: {type: object}}
    Spaces:
      type: object
      properties: {spaces: {type: array, items: {$ref: '#/components/schemas/Space'}}}
    Folders:
      type: object
      properties: {folders: {type: array, maxItems: 0}}
    Status:
      type: object
      properties: {id: {type: string}, status: {type: string}, color: {type: [string, 'null']}, orderindex: {type: integer}, type: {enum: [open, custom, closed]}, icon: {type: [string, 'null'], description: 'Since 2.9.0: the column icon, one emoji or an icon id such as tabler:bug'}}
    List:
      type: object
      properties: {id: {type: string}, name: {type: string}, content: {type: string}, task_count: {type: integer}, archived: {type: boolean}, space: {type: object}, folder: {type: object}, statuses: {type: array, items: {$ref: '#/components/schemas/Status'}}, warnings: {$ref: '#/components/schemas/Warnings'}}
    Lists:
      type: object
      properties: {lists: {type: array, items: {$ref: '#/components/schemas/List'}}}
    Task:
      type: object
      properties:
        id: {type: string}
        number: {type: [integer, 'null'], description: 'Since 2.10.0: the readable number (#123); null without task_numbers'}
        name: {type: string}
        description: {type: string}
        text_content: {type: string}
        markdown_description: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        priority: {type: [object, 'null'], properties: {id: {type: string}, priority: {enum: [urgent, high, normal, low]}, color: {type: string}}}
        date_created: {type: string, description: Unix milliseconds}
        date_updated: {type: string}
        date_done: {type: [string, 'null']}
        due_date: {type: [string, 'null']}
        start_date: {type: [string, 'null']}
        time_estimate: {type: [string, 'null'], description: milliseconds}
        time_spent: {type: integer, description: milliseconds}
        archived: {type: boolean}
        creator: {$ref: '#/components/schemas/Person'}
        assignees: {type: array, items: {$ref: '#/components/schemas/Person'}}
        watchers: {type: array, items: {$ref: '#/components/schemas/Person'}}
        tags: {type: array, items: {type: object, properties: {name: {type: string}}}}
