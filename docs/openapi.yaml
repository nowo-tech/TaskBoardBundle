# Task API (spec 213), shaped like ClickUp API v2. Generated from the bundle's routes; kept in step by TaskApiOpenApiTest.
openapi: 3.1.0
info:
  title: TaskBoardBundle Task API
  version: 2.2.0
  description: 'A REST API shaped like ClickUp API v2, off unless api.enabled. Paths are relative to api.prefix (default /api/tasks). See docs/API.md for levels, where, the differences from ClickUp and the host''s hooks.'
servers:
  - url: /api/tasks
security:
  - token: []
paths:
  '/v2/checklist/{checklist_id}':
    parameters:
      - {name: checklist_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: checklist_delete
      summary: 'Archive a checklist''s items'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: checklist_update
      summary: 'Rename a checklist'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NameBody'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/checklist/{checklist_id}/checklist_item':
    parameters:
      - {name: checklist_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: item_create
      summary: 'A checklist item (a subtask), counted against active tasks'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ItemCreate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ChecklistWrapper'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/checklist/{checklist_id}/checklist_item/{checklist_item_id}':
    parameters:
      - {name: checklist_id, in: path, required: true, schema: {type: string}}
      - {name: checklist_item_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: item_delete
      summary: 'Archive an item'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: item_update
      summary: 'Rename, resolve or assign an item'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ItemUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ChecklistWrapper'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/comment/{comment_id}':
    parameters:
      - {name: comment_id, in: path, required: true, schema: {type: string}}
    put:
      operationId: comment_update
      summary: 'Edit a comment (since 2.16.0); its author by default (api.hooks.comment_edit_policy)'
      description: 'Least level: My tasks (own). Missing, deleted, out of reach or not editable: 404 alike.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: board_delete
      summary: 'Erase a board, tracked time kept; 202 until done'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}}
        '202': {description: 'Tasks remain: call again after Retry-After', content: {application/json: {schema: {type: object, properties: {status: {const: in_progress}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      operationId: list
      summary: 'A board, its statuses (columns) and its task count'
      description: 'Least level: My tasks. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: board_update
      summary: 'Rename a board or change its description'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ListBody'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}/field':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: list_fields
      summary: 'Custom fields a provider sync imported'
      description: 'Least level: Read. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Fields'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}/status':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: status_create
      summary: 'Add a column (not in ClickUp''s API)'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/StatusBody'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}/status/order':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
    put:
      operationId: status_order
      summary: 'Reorder the columns (not in ClickUp''s API)'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/StatusOrder'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}/status/{status_id}':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
      - {name: status_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: status_delete
      summary: 'Delete a column (not in ClickUp''s API)'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: status_update
      summary: 'Rename or recolour a column (not in ClickUp''s API)'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/StatusBody'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/list/{list_id}/task':
    parameters:
      - {name: list_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: list_tasks
      summary: 'Tasks of a board, 100 per page'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {name: 'page', in: query, schema: {type: string}}
        - {name: 'order_by', in: query, schema: {type: string}}
        - {name: 'reverse', in: query, schema: {type: string}}
        - {name: 'subtasks', in: query, schema: {type: string}}
        - {name: 'include_closed', in: query, schema: {type: string}}
        - {name: 'archived', in: query, schema: {type: string}}
        - {name: 'statuses[]', in: query, schema: {type: array, items: {type: string}}}
        - {name: 'assignees[]', in: query, schema: {type: array, items: {type: string}}}
        - {name: 'tags[]', in: query, schema: {type: array, items: {type: string}}}
        - {name: 'due_date_gt', in: query, schema: {type: string}}
        - {name: 'due_date_lt', in: query, schema: {type: string}}
        - {name: 'date_created_gt', in: query, schema: {type: string}}
        - {name: 'date_created_lt', in: query, schema: {type: string}}
        - {name: 'date_updated_gt', in: query, schema: {type: string}}
        - {name: 'date_updated_lt', in: query, schema: {type: string}}
        - {name: 'date_done_gt', in: query, schema: {type: string}}
        - {name: 'date_done_lt', in: query, schema: {type: string}}
        - {name: 'include_markdown_description', in: query, schema: {type: string}}
        - {name: 'query', in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TaskPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      operationId: task_create
      summary: 'Create a task (or a subtask with parent)'
      description: 'Least level: Tasks. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TaskCreate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/space/{space_id}':
    parameters:
      - {name: space_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: space
      summary: 'A space'
      description: 'Least level: My tasks. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/space/{space_id}/folder':
    parameters:
      - {name: space_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: folders
      summary: 'Always empty: every board is a folderless list'
      description: 'Least level: My tasks. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Folders'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/space/{space_id}/list':
    parameters:
      - {name: space_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: lists
      summary: 'The boards of a space the token reaches'
      description: 'Least level: My tasks. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Lists'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      operationId: board_create
      summary: 'Create a board in a space'
      description: 'Least level: Full. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ListBody'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/space/{space_id}/tag':
    parameters:
      - {name: space_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: space_tags
      summary: 'Tags of the open tasks the token reaches'
      description: 'Least level: Read. The person''s access and where still apply.'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Tags'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/task/bulk':
    post:
      operationId: task_bulk
      summary: 'Atomic bulk update of 1 to 50 tasks of one space (since 2.16.0)'
      description: 'Least level: My tasks (own fields). Any item refused writes nothing: 409 BULK_001 with failures[] (each item''s own status and ECODE).'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {type: object, required: [tasks], properties: {tasks: {type: array, maxItems: 50, items: {type: object, required: [id], properties: {id: {type: string}, base_revision: {type: integer}, description: {type: string}, markdown_content: {type: string}, status: {type: string}, tags: {type: array, items: {type: string}}, priority: {type: integer, nullable: true}, due_date: {type: integer, nullable: true}, start_date: {type: integer, nullable: true}, assignees: {type: object}}}}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/task/{task_id}':
    parameters:
      - {name: task_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: task_delete
      summary: 'Erase a task and its subtasks, tracked time kept'
      description: 'Least level: Tasks. The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      operationId: task
      summary: 'A task'
      description: 'Least level: My tasks (own). The person''s access and where still apply. Since 2.10.0, with custom_task_ids=true the task_id is the task''s number (123 or #123) within space_id or list_id.'
      parameters:
        - {name: 'include_subtasks', in: query, schema: {type: string}}
        - {name: 'include_markdown_description', in: query, schema: {type: string}}
        - {name: 'custom_task_ids', in: query, description: 'Since 2.10.0: true = task_id is the task number', schema: {type: string}}
        - {name: 'space_id', in: query, description: 'Since 2.10.0, with custom_task_ids: the space whose numbers to search (task_numbers.scope tenant)', schema: {type: string}}
        - {name: 'list_id', in: query, description: 'Since 2.10.0, with custom_task_ids: the list whose numbers to search (any scope)', schema: {type: string}}
        - {name: 'team_id', in: query, description: 'Accepted for ClickUp clients and ignored', schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: task_update
      summary: 'Update a task; My tasks: status, dates and description of its own'
      description: 'Least level: My tasks (own). The person''s access and where still apply.'
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TaskUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  '/v2/task/{task_id}/attachment':
    parameters:
